        <h2 id="why-mccluskieganj-is-jharkhand-s-most-un">Why McCluskieganj Is Jharkhand's Most Unusual Village</h2>
        <p>In <strong>1933, Calcutta-based Anglo-Indian businessman E.T. McCluskie</strong> leased <strong>10,000 acres</strong> from the Maharaja of Ratu to build <strong>‘McCluskieganj — a home for Anglo-Indians’</strong>. At its peak (1960s), 400 Anglo-Indian families lived in <strong>gabled bungalows with fireplaces, chimneys, and Burma teak</strong> — complete with a club, church, and railway station.</p><p>Today, ~20 Anglo-Indian families remain, but <strong>300+ bungalows stand</strong> — some restored as homestays, some decayed poetically in Sal forest. Uniqueness: it's <strong>India's only Anglo-Indian village</strong> — a living colonial forest hamlet 40 km from Ranchi where you hear English surnames (Gordon, Donaghy), tribals sell mahua at the Haat, and jackals call at night from Jackhills. Writers call it 'Jharkhand's mini England'.</p>

        <h2 id="how-to-reach-mccluskieganj">How to Reach McCluskieganj</h2>
        <ul><li><strong>From Ranchi (42 km):</strong> Ranchi → Piska More → Khalari (NH-39) → McCluskieganj link road (1 hr 15 min). Road: NH-39 4-lane till Khalari, then single forest road — drive slow, forest crossing.</li><li><strong>By train:</strong> McCluskieganj station (halt) + Khalari (8 km, regular trains) → auto to village (₹150).</li><li><strong>Best arrival:</strong> Morning 9 AM — bungalows photogenic in soft light; afternoon Jackhills trek.</li></ul>

        <h2 id="top-things-to-do-in-mccluskieganj">Top Things to Do in McCluskieganj</h2>
        <h3>1. Bungalow Trail — Donaghy House, Gordon House, Mrs. Garrett's</h3><p>Walk the forest lanes and photograph colonial bungalows with sloping roofs, fireplaces, and overgrown gardens. Gordon House is a homestay — you can lunch there with permission.</p><h3>2. Jackhills Trek & Kanhar Hill Sunset</h3><p>2 km forest trek to Jackhills (rocky outcrop, jackal habitat, 30-min hike) + 5 km drive to Kanhar Hill for sunset over Damodar valley — stunning.</p><h3>3. St. John's Church (1935) & McCluskieganj Market</h3><p>Anglo-Indian church with stained glass + weekly Haat (Friday) where Oraon tribals sell forest honey, mahua, and Sal-leaf plates.</p><h3>4. Duga Dugi River Picnic + Homestay Night</h3><p>Shallow river 2 km from village — picnic + wade. Stay overnight in a bungalow homestay (fireplace dinner, stories from Anglo-Indian aunties) — that's the McCluskieganj soul.</p>

        <h2 id="combine-with-netarhat-or-patratu">Combine With Netarhat or Patratu</h2>
        <p>McCluskieganj (42 km Ranchi) → Netarhat (90 km further via Latehar) is the classic 'Heritage + Hill Station' 2-day District Car package. Day 1: Ranchi→McCluskieganj (stay), Day 2: McCluskieganj→Netarhat sunrise. One cab, two worlds.</p>

        <div class="faq-item"><h4>How far is McCluskieganj from Ranchi?</h4><p>42 km from Ranchi (Birsa Chowk) via NH-39 → Lapra → McCluskieganj (1 hr 15 min). Road: NH-39 4-lane till Khalari, then scenic 2-lane forest road. Nearest rail: McCluskieganj station (1 km, halt for few trains).</p></div><div class="faq-item"><h4>Can we stay in McCluskieganj? Homestays available?</h4><p>Yes — bungalow homestays: Gordon Guest House, Riverside Bungalow, Donaghy House (₹1,500-3,000/night, British-era bungalows with fireplace, cook included). Book via Ranchi tour operators or direct call. District Car can arrange pick-up.</p></div><div class="faq-item"><h4>What to see in McCluskieganj in one day?</h4><p>Colonial bungalow trail (Donaghy, Gordon), St. John's Church (1935), Jackhills trek (2 km), Kanhar Hill sunset, Duga Dugi river picnic, tribal Haat (Friday). Full day needed; half-day rush misses bungalows.</p></div><div class="faq-item"><h4>Cab fare from Ranchi to McCluskieganj?</h4><p>Ranchi→McCluskieganj RT: District Car Mini ₹1,899 / Sedan ₹2,399 / SUV ₹3,199 (7 hrs, homestay drop included). Overnight with next-day Netarhat add-on: SUV ₹6,499 (2 days).</p></div>
