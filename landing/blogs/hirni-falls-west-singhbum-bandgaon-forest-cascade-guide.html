        <h2 id="why-hirni-falls-is-jharkhand-s-wildest-h">Why Hirni Falls Is Jharkhand's Wildest Hidden Cascade</h2>
        <p>8 km from <strong>Bandgaon</strong> (West Singhbhum block HQ), at the <strong>edge of Saranda Sal forest</strong>, the <strong>Ramgadh River</strong> drops <strong>30 ft over Sal-rock slabs</strong> into a <strong>rocky pool</strong> — no steps, no railings, no stalls. For years, only <strong>Ho tribal villagers</strong> and forest guards knew it; even Chaibasa locals rarely visited.</p><p>Uniqueness: it's <strong>Jharkhand's most off-grid waterfall</strong> — Saranda forest on three sides, tribals fishing downstream, no tourism board signboard. Unlike Hundru (700 steps, crowds) or Jonha (500 steps, stalls), Hirni offers <strong>forest + water + solitude</strong>. The approach itself is a <strong>2 km forest walk through Bandgaon Ghat</strong> — Sal canopy, bird calls, and fresh dung (elephants). Perfect for travellers who want a waterfall without a queue.</p>

        <h2 id="how-to-reach-hirni-falls">How to Reach Hirni Falls</h2>
        <ul><li><strong>From Bandgaon (8 km):</strong> Bandgaon Market → forest road (2 km kutcha, then 15-min walk). Park at forest edge (₹0, no lot).</li><li><strong>From Chaibasa (85 km):</strong> Chaibasa → Bandgaon via NH-20 → Hirni diversion (2.5 hrs). Road: NH-20 good till Bandgaon, then forest.</li><li><strong>From Ranchi (90 km):</strong> Ranchi → Khunti → Bandgaon → Hirni (3 hrs). Road: Ranchi-Bandgaon 2-lane good (new PMGSY).</li><li><strong>Guide:</strong> Bandgaon guide (₹300) must — forest path confusing, elephant dung markers; District Car books via call.</li></ul>

        <h2 id="top-things-to-do-at-hirni-falls">Top Things to Do at Hirni Falls</h2>
        <h3>1. Forest Walk + Waterfall Sit-out (2 km trail)</h3><p>Walk Sal forest trail, sit on warm rocks near pool, picnic (carry mat). Best 10 AM - 2 PM when sun hits water.</p><h3>2. Pool Dip (Winter Safe) & Photography</h3><p>5-ft pool for foot-dip (not swim) in Nov-Feb; monsoon pool is flooded — avoid. Shoot cascade with Sal canopy in frame.</p><h3>3. Bandgaon Ghat Drive — Forest + Hills</h3><p>Bandgaon Ghat (approach road) is itself scenic — winding through Sal + small hills; District Car driver slows for photos.</p><h3>4. Combine with Saranda Fringe & Thalkobad Village</h3><p>Hirni (AM) + Thalkobad tribal village walk (PM, 15 km inside Saranda, guide) — West Singhbhum forest-water-tribal triangle.</p>

        <h2 id="safety-essentials">Safety & Essentials</h2>
        <p>Carry 2L water, food, power bank, grip shoes — no stalls, no network. Return before 5 PM (forest closes, elephant movement). District Car SUV (Bolero) required last 2 km kutcha; sedan not recommended.</p>

        <h2 id="faq">Frequently Asked Questions (FAQ)<\/h2>
        <div class="faq-item"><h4>How high is Hirni Falls and can we swim?</h4><p>~30 ft (9m) drop over Sal-rock into a 5-ft deep natural pool (safe for foot-dip, not deep swim). Monsoon flow heavy (Jul-Sep) — avoid pool then; winter (Nov-Feb) pool is crystal and gentle.</p></div><div class="faq-item"><h4>How to reach Hirni Falls from Bandgaon/Chaibasa?</h4><p>Hirni Falls is 8 km from Bandgaon block HQ (West Singhbhum) via forest road (last 2 km kutcha, walk 15 min). 85 km from Chaibasa (2.5 hrs), 130 km from Jamshedpur (4 hrs), 90 km from Ranchi (3 hrs via Bandgaon). District Car SUV needed last stretch.</p></div><div class="faq-item"><h4>Is Hirni Falls safe for families with local guide?</h4><p>Yes with guide (₹300, Bandgaon) — forest path, no network, elephant corridor nearby. Day visit only (6 AM - 5 PM). No stalls — carry food/water. District Car driver knows guide contact.</p></div><div class="faq-item"><h4>Cab fare to Hirni Falls Bandgaon?</h4><p>Bandgaon→Hirni RT: District Car SUV ₹1,499 (2.5 hrs). Chaibasa→Hirni RT: SUV ₹2,999 (5 hrs, forest road). Ranchi→Hirni→Bandgaon Ghat day: SUV ₹4,999 (10 hrs).</p></div>
