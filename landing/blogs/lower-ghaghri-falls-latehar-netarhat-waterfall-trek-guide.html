        <h2 id="why-lower-ghaghri-is-netarhat-s-most-uni">Why Lower Ghaghri Is Netarhat's Most Unique Waterfall</h2>
        <p>12 km from <strong>Netarhat (Queen of Chotanagpur, 3,700 ft)</strong>, the <strong>Ghaghri River</strong> — born on the Netarhat plateau — drops off the plateau edge in <strong>two successive cascades</strong>: <strong>Upper Ghaghri (140 ft)</strong> and <strong>Lower Ghaghri (180 ft)</strong>, 300m apart — a <strong>staircase waterfall</strong> you can photograph both tiers from one pine-forest viewpoint.</p><p>Uniqueness: Jharkhand's only <strong>plateau-edge staircase fall</strong> — water falling off Netarhat's flat top through <strong>pine + Sal forest</strong> (Netarhat's rare pine patches). Unlike Hundru/Jonha (single river, single drop), Ghaghri is <strong>twin + plateau + pine</strong> — trekkers get forest + fall + valley in one walk. Locals call it 'Netarhat's private fall' because only hill-station visitors find it.</p>

        <h2 id="how-to-reach-lower-ghaghri-falls">How to Reach Lower Ghaghri Falls</h2>
        <ul><li><strong>From Netarhat (12 km):</strong> Netarhat Bazaar → forest road toward Ghaghri (30 min, narrow, SUV). Road head → 1 km trek to lower tier (20 min). Start 7 AM to combine with Netarhat sunrise (5:45 AM at Magnolia Point).</li><li><strong>From Ranchi (145 km):</strong> Ranchi → Latehar → Netarhat → Ghaghri (4 hrs). Road: Ranchi-Latehar NH-39 good, Latehar-Netarhat ghat winding (40 km ghat, drive slow).</li><li><strong>From Latehar (75 km):</strong> Latehar → Netarhat road (2 hrs) → Ghaghri diversion.</li><li><strong>Guide & timing:</strong> Netarhat guide (₹300) at Bazaar; forest entry free, open 6 AM - 5 PM; carry water, hat.</li></ul>

        <h2 id="top-things-to-do-at-lower-ghaghri-falls">Top Things to Do at Lower Ghaghri Falls</h2>
        <h3>1. Twin-Tier Viewpoint — One Frame, Two Falls</h3><p>Pine forest viewpoint captures both tiers — best 9-11 AM when sun lights the valley. Use wide lens (18mm).</p><h3>2. Forest Trek to Upper Tier Pool</h3><p>300m scramble to upper pool (knee-deep, foot-dip safe in winter). Trek through pine + Sal, hear hill mynahs.</p><h3>3. Netarhat Sunrise + Ghaghri Same Morning</h3><p>Magnolia Point sunrise (5:45 AM) → drive 12 km → Ghaghri trek by 7:30 AM — Netarhat's best half-day.</p><h3>4. Betla + Ghaghri Weekend Circuit</h3><p>Day 1: Ranchi→Netarhat (stay), Day 2: Ghaghri (AM) → Betla National Park safari (PM, 60 km) → Ranchi — District Car 2-day package.</p>

        <h2 id="stay-food">Stay & Food</h2>
        <p>Netarhat: JTDC Prabhat Vihar (₹1,500/night, sunrise view) + private hotels (Sunrise Guest House). Food: Prabhat Vihar thali (₹120), Netarhat Bazaar tea + aloo paratha. District Car SUV handles Netarhat ghat best (high clearance).</p>

        <h2 id="faq">Frequently Asked Questions (FAQ)<\/h2>
        <div class="faq-item"><h4>What is the height and best season for Lower Ghaghri Falls?</h4><p>Total 320 ft (98m) in two tiers: Upper tier 140 ft + Lower tier 180 ft, 300m apart. Best flow July-February; peak monsoon (Aug) is thunderous, winter (Nov-Feb) is gentle and trek-friendly. Avoid heavy monsoon trek slush.</p></div><div class="faq-item"><h4>How far is Lower Ghaghri from Netarhat and Ranchi?</h4><p>12 km from Netarhat town (30 min via forest road, last 1 km walk, SUV needed), 145 km from Ranchi (4 hrs via Latehar→Netarhat), 75 km from Latehar town (2 hrs). Combine with Upper Ghaghri + Netarhat sunset same day.</p></div><div class="faq-item"><h4>Is there a trek to Lower Ghaghri Falls?</h4><p>1 km forest trail (moderate, 20 min) from road head to lower tier viewpoint + 300m scramble to upper tier pool (carry grip shoes). Pine + Sal shade; leeches in Aug-Sep. Guide (₹300, Netarhat) recommended.</p></div><div class="faq-item"><h4>Cab fare from Ranchi to Lower Ghaghri Falls?</h4><p>Ranchi→Netarhat→Lower Ghaghri RT: District Car Mini ₹3,499 / Sedan ₹4,199 / SUV ₹5,499 (10 hrs, Netarhat night add ₹800). Netarhat→Ghaghri RT (local): SUV ₹1,199 (2 hrs).</p></div>
