        <h2 id="why-ranchi-s-jagannath-temple-is-called-">Why Ranchi's Jagannath Temple Is Called 'Chhoti Puri'</h2>
        <p>At <strong>Dhurwa, 10 km from Ranchi station</strong>, atop a <strong>45m hillock</strong>, stands <strong>Jagannath Temple (1691)</strong> — built by <strong>Barsagarh King Thakur Ani Nath Shahdeo</strong> as a <strong>replica of Puri Jagannath Temple (Odisha)</strong> — same <strong>Kalinga spire, same Neem-wood idols (Jagannath-Balabhadra-Subhadra)</strong>, but on a hill with <strong>Ranchi city panorama</strong>.</p><p>Uniqueness: it's <strong>Jharkhand's only Puri-style hill temple</strong> — you climb <strong>50 hill steps</strong>, worship, then turn and see <strong>Ranchi skyline + Dhurwa Dam</strong> behind you. Every June-July, <strong>Ranchi Rath Yatra</strong> pulls a <strong>45-ft wooden chariot</strong> 1.5 km to Mausi Bari with <strong>50,000 devotees + Mandar drums</strong> — the <strong>largest tribal-meets-Odisha festival</strong> in Jharkhand. Non-festival days: serene hill sunset.</p>

        <h2 id="how-to-reach-jagannath-temple-ranchi">How to Reach Jagannath Temple Ranchi</h2>
        <ul><li><strong>From Ranchi Jn (10 km):</strong> Station → HEC Road → Dhurwa → temple hill (20 min, city road).</li><li><strong>From Birsa Chowk (9 km):</strong> Direct Dhurwa Road (18 min) — good till hill base, then 50 steps.</li><li><strong>Parking & steps:</strong> Base parking (₹20/car) + 50 steps (5 min, railings, easy). Elderly: slow climb, railings, carry water.</li><li><strong>Timing:</strong> Temple 6 AM - 12 PM & 3-8 PM; aarti 7 AM & 7 PM. Rath Yatra day: temple closed 10 AM - 3 PM during chariot procession.</li></ul>

        <h2 id="top-things-to-do-at-jagannath-temple-ran">Top Things to Do at Jagannath Temple Ranchi</h2>
        <h3>1. Hill darshan + City Panorama</h3><p>Darshan of Neem idols + hilltop view: Ranchi city, HEC, and Dhurwa Dam in one frame — best 5-6 PM.</p><h3>2. Rath Yatra (June-July) — 45-ft Chariot</h3><p>If in Ranchi during Ashadha, watch chariot pull (1.5 km) + Mausi Bari stalls (Puri sweets, tribal crafts) — book cab early (road closed).</p><h3>3. Kache Pahad Trek (1 km) & Dhurwa Dam Picnic</h3><p>Small hillock 1 km from temple for short trek (15 min) + Dhurwa Dam reservoir (2 km) for evening picnic with locals.</p><h3>4. Combine: Jagannath → Rock Garden → Kanke Dam Sunset Circuit</h3><p>Afternoon Jagannath (2 PM) → Rock Garden (4 PM, see hillside sculptures) → Kanke Dam boat + sunset (5:30 PM) — Ranchi's hill-temple-garden-dam evening in one cab.</p>

        <h2 id="food-facilities">Food & Facilities</h2>
        <p>Temple prasad (Khaja, Mahaprasad ₹30) + Dhurwa market tea + samosa. No restaurant — eat at Lalpur/Ranchi (15 min). District Car driver waits at base (hill steps short).</p>

        <div class="faq-item"><h4>When is Jagannath Rath Yatra in Ranchi and how big?</h4><p>Ranchi Rath Yatra syncs with Puri (June-July, Ashadha). 45-ft wooden chariot pulled from Jagannath Temple to Mausi Bari (1.5 km) with 50k+ devotees, tribal drums (Mandar), and stalls from Odisha. Book cab a week ahead — road closure 8 AM - 6 PM on Yatra day.</p></div><div class="faq-item"><h4>How is Ranchi Jagannath Temple related to Puri?</h4><p>Built in 1691 by Barsagarh King Thakur Ani Nath Shahdeo on the model of Puri Jagannath — same Kalinga architecture, same Jagannath-Balabhadra-Subhadra idols (Neem wood). Called 'Chhoti Puri' — Jharkhand's Puri for those who can't go to Odisha.</p></div><div class="faq-item"><h4>How to reach Jagannath Temple Ranchi?</h4><p>10 km from Ranchi Jn / 9 km from Birsa Chowk (20 min via Dhurwa Road, city road, good). Address: Dhurwa, Ranchi - on small hillock (50 steps up). Parking at base (₹20/car). Auto from Ranchi station ₹150; District Car till hill base saves steps.</p></div><div class="faq-item"><h4>Cab fare from Ranchi city to Jagannath Temple?</h4><p>Ranchi city→Jagannath Temple RT: District Car Auto ₹399 / Mini ₹799 / SUV ₹1,199 (2.5 hrs, hill wait). Add Rock Garden + Kanke Dam same evening: SUV ₹1,799 (4 hrs, sunset circuit).</p></div>
