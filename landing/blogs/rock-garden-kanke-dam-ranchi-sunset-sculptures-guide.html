        <h2 id="why-rock-garden-is-ranchi-s-open-air-art">Why Rock Garden Is Ranchi's Open-Air Art Hill</h2>
        <p>On <strong>Gonda Hill, Kanke Road (8 km Ranchi)</strong>, <strong>Rock Garden</strong> is a <strong>hillside art project by Padmashri Ram Sutar</strong> (who later sculpted the 182m Statue of Unity). Instead of bringing sculptures to a garden, Sutar <strong>carved the hill's own rocks</strong> into figures — tribal drummers (Mandar), flute players, abstract forms — and integrated them with the hill's boulders, waterfalls (small, pumped), and stepped lawns. Below, <strong>Kanke Dam reservoir (1955, Gonda River)</strong> spreads blue.</p><p>Uniqueness: it's <strong>Jharkhand's only art-carved hill</strong> — sculptures are not installed, they <em>are</em> the hill. The garden overlooks <strong>Kanke reservoir + paddy fields + Ranchi skyline</strong> — sunset from the top lawn (5:45 PM) is a postcard where art + water + city meet. Evening families call it 'Ranchi ka mini Ooty'.</p>

        <h2 id="how-to-reach-rock-garden-kanke-dam">How to Reach Rock Garden & Kanke Dam</h2>
        <ul><li><strong>From Ranchi Jn (8 km):</strong> Station → Kanke Road → Gonda Hill (20 min, city road).</li><li><strong>From Birsa Chowk (7 km):</strong> Direct Kanke Road (18 min).</li><li><strong>Steps & timing:</strong> Base parking → 100m walk + 50 hill steps (5 min, railings). Garden 9 AM - 6 PM; Kanke boating 9 AM - 5:30 PM; sunset garden 5:15-6 PM is best.</li><li><strong>Food & stalls:</strong> Garden canteen (samosa, tea) + Kanke base dhabas (litti, fish fry). Carry water for hill steps.</li></ul>

        <h2 id="top-things-to-do-at-rock-garden-kanke-da">Top Things to Do at Rock Garden & Kanke Dam</h2>
        <h3>1. Sculpture Trail — Tribal Music in Stone</h3><p>Walk hill steps and spot Sutar's rock sculptures: Mandar drummers, Santhal dancers, abstract waves — each carved from hill rock (not imported). Plaques explain.</p><h3>2. Kanke Dam Boating + Reservoir View</h3><p>Pedal/motor boat on Kanke reservoir (30 min) with hill reflection — evening water is pink at sunset.</p><h3>3. Sunset from Top Lawn (5:15-6 PM)</h3><p>Top lawn gives Gonda Hill + Kanke water + Ranchi skyline in one sunset frame — tripod spot at eastern edge.</p><h3>4. Combine: Rock Garden (4 PM) → Kanke Boating (5 PM) → Jagannath Temple Hill (6 PM) — Ranchi Sunset Trio</h3><p>One District Car evening: garden art + lake boat + hill temple sunset — 4 hrs, no hotel needed.</p>

        <h2 id="combine-circuits">Combine Circuits</h2>
        <p>Morning: Getalsud-Rukka dams (35 km) → afternoon: Jagannath Temple → evening: Rock Garden + Kanke sunset — Ranchi's dam-heritage-garden-lake full day. District Car 8-hr package covers all with fixed wait.</p>

        <h2 id="faq">Frequently Asked Questions (FAQ)<\/h2>
        <div class="faq-item"><h4>Who made Ranchi Rock Garden sculptures?</h4><p>Padmashri Ram Sutar — sculptor of the Statue of Unity (Gujarat) — carved Ranchi Rock Garden in the 1990s from Gonda Hill rocks. Sculptures depict tribal drummers, musicians, and abstract art, integrated with the hill's natural boulders.</p></div><div class="faq-item"><h4>What are Rock Garden timings and entry fee?</h4><p>Rock Garden: 9 AM - 6 PM daily. Entry: ₹30/adult, ₹15/child. Kanke Dam boating at base: pedal ₹100, motor ₹200 (30 min, 9 AM - 5:30 PM). Evening light on sculptures is best 4:30-6 PM golden hour.</p></div><div class="faq-item"><h4>How far is Rock Garden & Kanke Dam from Ranchi station?</h4><p>8 km from Ranchi Jn / 7 km from Birsa Chowk (20 min via Kanke Road, city road, good). Address: Gonda Hill, Kanke Road. Parking at hill base (₹20/car), then 100m walk + steps to garden. Auto from station ₹120 RT.</p></div><div class="faq-item"><h4>Cab fare from Ranchi to Rock Garden & Kanke Dam?</h4><p>Ranchi city→Rock Garden+Kanke RT: District Car Auto ₹499 / Mini ₹899 / SUV ₹1,499 (3 hrs, sunset wait). Add Jagannath Temple same evening: SUV ₹1,799 (4 hrs, hill-temple-garden-dam sunset circuit).</p></div>
