        <h2 id="why-sun-temple-bundu-is-jharkhand-s-char">Why Sun Temple Bundu Is Jharkhand's Chariot in a Lake</h2>
        <p>On <strong>NH-33 (Ranchi-Tata Road), 35 km from Ranchi</strong>, in <strong>Bundu block</strong>, stands <strong>Sun Temple (1991)</strong> — a <strong>90-ft tall stone chariot on a lake (Surajkund)</strong>. Seven white <strong>horses (each 7 ft)</strong> appear to pull a <strong>war chariot with 18 carved wheels (each 1m, Konark-style erotic and war panels mini-copied)</strong> that carries the <strong>Surya sanctum</strong> — the deity rides a vehicle, not a building.</p><p>Uniqueness: <strong>Jharkhand's only chariot temple</strong> — a <strong>lake-island chariot</strong> where you <strong>causeway-walk around Surya's vehicle</strong> before entering. Built by <strong>Sanskrit Vihar (spiritual trust) with Tata Steel Rural Development Society funds</strong>, the temple blends <strong>Odisha chariot art with tribal lake-pilgrim</strong> faith. On <strong>Chhath Puja (Oct-Nov)</strong>, the lake's edge becomes Jharkhand's most photographed arghya — sun setting behind the chariot reflected in Surajkund.</p>

        <h2 id="how-to-reach-sun-temple-bundu">How to Reach Sun Temple Bundu</h2>
        <ul><li><strong>From Ranchi (35 km):</strong> Ranchi → NH-33 (Tata Road) → Sun Temple (1 hr, 4-lane excellent, right on highway, parking at lake side).</li><li><strong>From Jamshedpur (95 km):</strong> Jamshedpur → NH-33 → Sun Temple (2.5 hrs) — stopover if Ranchi↔Jamshedpur same day.</li><li><strong>From Dassam Falls (15 km):</strong> Dassam → NH-33 → Sun Temple (20 min) — Dassam + Sun Temple is the classic Tata Road duo.</li><li><strong>Timing & parking:</strong> Temple 6 AM - 7 PM (aarti 6 AM & 6 PM); lake causeway open till 7:30 PM; parking free (lake side, ₹20 at highway dhaba if crowded during Chhath).</li></ul>

        <h2 id="top-things-to-do-at-sun-temple-bundu">Top Things to Do at Sun Temple Bundu</h2>
        <h3>1. Chariot Walk — 18 Wheels, 7 Horses Photo Trail</h3><p>Causeway around Surajkund — photograph each wheel (different carving) and the 7 horses pulling. Guide (₹200, at gate) explains wheel panels.</p><h3>2. Sanctum Darshan — Surya on His Vehicle</h3><p>Enter sanctum (stairs into chariot cabin) — Surya idol with Chhaya & Sangya. Offer water to Surajkund before/after.</p><h3>3. Surajkund Lake Edge — Chhath-Style Photo</h3><p>Lake edge ghat for foot-dip, Chhath arghya rehearsal, and chariot reflection in still morning water (6-8 AM best).</p><h3>4. Combine: Sun Temple → Dassam Falls (15 km) → Ranchi — Tata Road Day</h3><p>Morning Sun Temple (7 AM) → Dassam Falls (10 AM, Kanchi River 144 ft) → return Ranchi by 1 PM — NH-33's two gems in half day, one cab.</p>

        <h2 id="food-facilities">Food & Facilities</h2>
        <p>NH-33 dhabas: Sun Temple dhaba (thali ₹80, litti, tea) + Bundu market sweets. No restaurant at temple — carry water. District Car driver knows Chhath crowd bypass roads (phone ahead Oct-Nov).</p>

        <h2 id="faq">Frequently Asked Questions (FAQ)<\/h2>
        <div class="faq-item"><h4>Why is Bundu Sun Temple built as a chariot?</h4><p>Designed by Sanskrit Vihar trust (1991) as a replica of Konark's chariot concept: 18 richly carved wheels (1m diameter), 7 white horses, and a sanctum as the chariot cabin — symbolizing Surya's daily journey. Architect: Umesh Chandra Sharma, funded partly by Tata Steel Rural Development.</p></div><div class="faq-item"><h4>How far is Sun Temple from Ranchi and Jamshedpur?</h4><p>35 km from Ranchi (Birsa Chowk) via Tata Road (NH-33, 1 hr, excellent 4-lane), 70 km from Bundu town center, 95 km from Jamshedpur (2.5 hrs via Tata Road). Located on NH-33 itself — can't miss while Ranchi→Jamshedpur.</p></div><div class="faq-item"><h4>Can we enter the Sun Temple lake?</h4><p>Lake (Surajkund) surrounds the chariot — boating not allowed, but you walk the causeway around it and dip feet at ghat (3-ft depth). Chhath Puja (Oct-Nov) is the grandest — 10,000 devotees offer arghya to setting sun from lake edge.</p></div><div class="faq-item"><h4>Cab fare from Ranchi to Sun Temple Bundu?</h4><p>Ranchi→Sun Temple Bundu RT: District Car Mini ₹1,499 / Sedan ₹1,899 / SUV ₹2,499 (4 hrs). Ranchi→Sun Temple→Dassam Falls same day (both on Tata Road): SUV ₹3,499 (6 hrs, two highlights, one highway).</p></div>
