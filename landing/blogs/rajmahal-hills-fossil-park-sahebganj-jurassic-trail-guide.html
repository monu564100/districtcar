        <h2 id="why-rajmahal-hills-is-jharkhand-s-jurass">Why Rajmahal Hills Is Jharkhand's Jurassic Time Capsule</h2>
        <p>Near <strong>Mandro village, 10 km from Sahebganj</strong>, the <strong>Rajmahal Hills</strong> — a <strong>200 km volcanic hill range along the Ganga</strong> — hides <strong>India's only Jurassic fossil park</strong>. On basalt slopes, you see <strong>150-180M-year-old plant fossils (Rajmahal flora: Ptilophyllum, Bucklandia — ferns, cycads, conifers)</strong> impressed on rock — from when Jharkhand was near the Equator and forests were Jurassic.</p><p>Uniqueness: the hills are <strong>118M-year-old volcanic basalt</strong> — erupted when <strong>India split from Gondwana</strong> (pre-Deccan Traps). You stand on <strong>volcanic fossil hills above the Ganga</strong> with <strong>Santhal villages</strong> farming in valleys — geology + tribal + river in one frame. The small <strong>Mandro Fossil Museum</strong> displays slabs, and the hills themselves are a <strong>Santhal sacred landscape</strong>. No other Jharkhand spot is this old.</p>

        <h2 id="how-to-reach-rajmahal-hills-fossil-park">How to Reach Rajmahal Hills Fossil Park</h2>
        <ul><li><strong>From Sahebganj (10 km):</strong> Sahebganj town → Mandro Road (20 min, partly kutcha last 2 km, walk 15 min to fossil slope).</li><li><strong>From Dumka (80 km):</strong> Dumka → Sahebganj via NH-133 (2.5 hrs) → Mandro — combine with Maluti temples same day.</li><li><strong>From Ranchi (400 km, overnight):</strong> Ranchi → Dumka → Sahebganj (8 hrs) — 2-day package with night at Sahebganj.</li><li><strong>Museum & guide:</strong> Mandro Fossil Museum (9 AM - 5 PM, free, closed Mon) + village guide (₹300) shows in-situ slabs — don't chip fossils (protected under Mines Act).</li></ul>

        <h2 id="top-things-to-do-at-rajmahal-hills">Top Things to Do at Rajmahal Hills</h2>
        <h3>1. Fossil Slab Trail — Touch 150M-Year-Old Leaves</h3><p>Walk basalt slope with guide to see leaf impressions on rock — Ptilophyllum (fern) is most common. Bring macro lens.</p><h3>2. Mandro Fossil Museum — Preserved Slabs</h3><p>Small museum with 30+ slabs, Jurassic timeline, and volcanic rock samples — good for kids (30 min).</p><h3>3. Santhal Village Walk — Tribal Hills Life</h3><p>Mandro Santhal village: mud houses, Sohrai paintings, weekly Haat (Monday) with tribal jewellery — cultural add-on.</p><h3>4. Ganga View from Rajmahal Hills + Sahebganj Riverfront</h3><p>Hilltop gives Ganga view (10 km east) + Sahebganj town; evening riverfront at Sahebganj for sunset boat.</p>

        <h2 id="stay-circuit">Stay & Circuit</h2>
        <p>Stay at Sahebganj (Hotel Raj, ₹800/night) or Dumka. District Car 2-day Ranchi→Dumka (Maluti, Masanjore)→Sahebganj (Fossil Park, Ganga) covers heritage + geology.</p>

        <h2 id="faq">Frequently Asked Questions (FAQ)<\/h2>
        <div class="faq-item"><h4>What fossils are found at Rajmahal Fossil Park?</h4><p>150-180 million-year-old plant fossils: Rajmahal flora (Ptilophyllum, Bucklandia) — fern, cycad, conifer impressions on basalt. Small museum at Mandro (Sahebganj) displays slabs. Fossils are in-situ on hill slopes (don't collect — protected).</p></div><div class="faq-item"><h4>How old are Rajmahal Hills geologically?</h4><p>Rajmahal Hills are 118M-year-old volcanic (basalt) hills from Gondwana break-up, when India-Africa split. Part of the Rajmahal Volcanics — same event that formed Deccan Traps later. Hills run 200 km along Ganga.</p></div><div class="faq-item"><h4>How to reach Rajmahal Hills Fossil Park?</h4><p>Fossil site near Mandro village, 10 km from Sahebganj town (20 min via Mandro Road, partly kutcha), 80 km from Dumka (2.5 hrs), 30 km from Rajmahal town (Bihar-JH border). Guide (₹300, Mandro) shows fossil slabs.</p></div><div class="faq-item"><h4>Cab fare to Rajmahal Hills Sahebganj?</h4><p>Sahebganj→Mandro Fossil Park RT: District Car Auto ₹499 / Mini ₹1,199 / SUV ₹1,799 (3 hrs). Dumka→Rajmahal RT: SUV ₹3,499 (6 hrs). Ranchi→Sahebganj (overnight, 400 km) via District Car 2-day: SUV ₹11,999.</p></div>
