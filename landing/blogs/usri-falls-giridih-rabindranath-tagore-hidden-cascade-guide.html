        <h2 id="why-usri-falls-is-more-than-a-waterfall-">Why Usri Falls Is More Than a Waterfall — It's Literary History</h2>
        <p>13 km from Giridih, the <strong>Usri River (tributary of Barakar)</strong> slips over <strong>gneiss rocks</strong> in a <strong>12m, 3-tier cascade</strong> surrounded by <strong>Sal and bamboo forest</strong> with <strong>Parasnath Hills (1,350m)</strong> looming behind. In monsoon, it roars; in winter, it whispers over mossy rocks — both photogenic.</p><p>Uniqueness: <strong>Rabindranath Tagore's Giridih connection</strong>. The Tagore family owned a house in Giridih; Rabindranath visited Usri repeatedly (1900s) and described it in letters and Bengali school texts as <em>'the laugh of forest water'</em>. For Bengali travellers from Dhanbad/Asansol/Kolkata, Usri is a <strong>literary pilgrimage</strong> — Tagore + waterfall in one trip. Satyajit Ray also referenced nearby Giridih landscapes.</p>

        <h2 id="how-to-reach-usri-falls">How to Reach Usri Falls</h2>
        <ul><li><strong>From Giridih (13 km):</strong> Giridih town → Usri Road (forest road, narrow but paved, 25 min). Last 1 km: park and walk forest trail (15 min).</li><li><strong>From Parasnath Hill base/Madhuban (18 km):</strong> Madhuban → Giridih Road → Usri diversion (30 min) — classic combo: morning Parasnath trek, afternoon Usri picnic.</li><li><strong>From Dhanbad (45 km):</strong> Dhanbad → Giridih via NH-114A (1.2 hrs) → Usri. Best as Dhanbad weekend.</li><li><strong>Parking:</strong> Small paid lot (₹30/car) at trailhead; forest entry free.</li></ul>

        <h2 id="top-things-to-do-at-usri-falls">Top Things to Do at Usri Falls</h2>
        <h3>1. Rock-Hop to the Top Tier — Gneiss Trail</h3><p>1 km forest trail with gneiss boulders to the upper cascade — moderate, wear shoes. Top view: water splitting over 3 rock steps + Parasnath backdrop.</p><h3>2. Picnic + Tagore Rock Photo Point</h3><p>Flat rocks near base for picnic; locals show 'Tagore Rock' where he sat. Carry Bengali book for photo — classic traveller shot.</p><h3>3. Combine with Parasnath Hill Trek & Khandoli Dam</h3><p>Usri (AM) + Parasnath temple trek (mid-day) + Khandoli Dam boating (PM) — Giridih's 3-in-1 day in one District Car SUV.</p><h3>4. Birding & Forest Walk (Nov-Feb)</h3><p>Sal forest around Usri hosts parakeets, woodpeckers, and Malabar pied hornbill (rare) — early morning walk with binoculars.</p>

        <h2 id="food-stay">Food & Stay</h2>
        <p>No stalls at falls — carry water/food or eat at Giridih town (Hotel Tulsi, dhabas at Bus Stand). Stay: Giridih Tourist Lodge (JTDC, ₹1,000/night) or combine as day trip from Dhanbad. District Car driver carries picnic mat on request.</p>

        <h2 id="faq">Frequently Asked Questions (FAQ)<\/h2>
        <div class="faq-item"><h4>What is the Tagore connection to Usri Falls?</h4><p>Rabindranath Tagore visited Giridih (his family owned a house there) and wrote about Usri Falls in 1900s letters; the falls appeared in Bengali textbooks as 'Usri-er Jharnā'. Locals still point to the rock where Tagore sat.</p></div><div class="faq-item"><h4>How far is Usri Falls from Giridih and Parasnath?</h4><p>13 km from Giridih town (25 min via Usri Road, partly forest), 18 km from Parasnath Hill base (Madhuban), 45 km from Dhanbad (1.2 hrs). Combine Usri + Parasnath trek same day.</p></div><div class="faq-item"><h4>Can we trek or swim at Usri Falls?</h4><p>Rocky trek (1 km forest trail, moderate) to top viewpoint; shallow pool at base for foot-dip, but no deep swimming (slippery gneiss, flash flow in monsoon). Wear grip shoes, avoid Jul-Aug heavy flow.</p></div><div class="faq-item"><h4>Cab fare from Giridih to Usri Falls?</h4><p>Giridih→Usri RT: District Car Auto ₹599 / Mini ₹1,199 / SUV ₹1,799 (4 hrs). Dhanbad→Usri RT: Mini ₹1,899 / SUV ₹2,699. Giridih→Usri→Parasnath same day: SUV ₹3,499 (8 hrs).</p></div>
