<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>District Car - Download Customer App on Google Play</title>
  <meta name="description" content="Download the District Car Customer App from Google Play Store. Transparent fares, 35% round-trip discount, and reliable cab booking across Jharkhand & Bihar.">
  <link rel="canonical" href="https://districtcar.in/customer">

  <!-- Open Graph / Meta Ads Preview -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://districtcar.in/customer">
  <meta property="og:title" content="District Car - Official Customer App">
  <meta property="og:description" content="Affordable, safe & verified cab bookings across Jharkhand. Download on Google Play Store.">
  <meta property="og:image" content="https://districtcar.in/og_preview.jpg">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="District Car - Customer App">
  <meta name="twitter:description" content="Fast cab booking across Jharkhand. Install from Google Play.">
  <meta name="twitter:image" content="https://districtcar.in/og_preview.jpg">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 15%, #0e275c 0%, #060e22 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .wrapper {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 24px;
      padding: 36px 26px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }
    .logo-badge {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.45);
    }
    .logo-badge svg {
      width: 32px;
      height: 32px;
      fill: #ffffff;
    }
    .brand-title {
      text-align: left;
    }
    .brand-title h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .brand-title span {
      font-size: 12px;
      color: #38bdf8;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-box {
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 14px;
      padding: 14px 18px;
      width: 100%;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
    }
    .spinner-wrap {
      position: relative;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      position: absolute;
      top: 0;
      left: 0;
    }
    .countdown-number {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      z-index: 2;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text h3 {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 3px;
    }
    .status-text p {
      font-size: 12px;
      color: #94a3b8;
    }
    .progress-bar-container {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 22px;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #2563eb);
      border-radius: 99px;
      transition: width 0.1s linear;
    }
    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 15px 20px;
      background: #ffffff;
      color: #0a192f;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
      margin-bottom: 18px;
    }
    .cta-btn:hover {
      background: #f1f5f9;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(255, 255, 255, 0.3);
    }
    .play-svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }
    .features-list {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
      text-align: left;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .feature-item:last-child {
      margin-bottom: 0;
    }
    .feature-icon {
      color: #38bdf8;
      font-size: 14px;
    }
    .footer-links {
      font-size: 11.5px;
      color: #64748b;
    }
    .footer-links a {
      color: #94a3b8;
      text-decoration: underline;
      margin: 0 6px;
    }
    .footer-links a:hover {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="brand-header">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24">
          <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.04 3H5.81l1.04-3zM19 17H5v-4.66l.12-.34h13.77l.11.34V17z"/>
          <circle cx="7.5" cy="14.5" r="1.5"/>
          <circle cx="16.5" cy="14.5" r="1.5"/>
        </svg>
      </div>
      <div class="brand-title">
        <h2>District Car</h2>
        <span>Official Customer App</span>
      </div>
    </div>

    <!-- 3-Second Processing Box -->
    <div class="status-box">
      <div class="spinner-wrap">
        <div class="spinner"></div>
        <span id="countdown" class="countdown-number">3</span>
      </div>
      <div class="status-text">
        <h3 id="statusHeader">Redirecting to Google Play...</h3>
        <p id="statusSub">Connecting in <span id="secLabel">3</span> seconds</p>
      </div>
    </div>

    <!-- Animated Progress Bar -->
    <div class="progress-bar-container">
      <div id="progressBar" class="progress-bar-fill"></div>
    </div>

    <!-- Direct Manual CTA Button -->
    <a id="playStoreLink" href="https://play.google.com/store/apps/details?id=com.districtcarcustomerd.app" class="cta-btn">
      <svg class="play-svg" viewBox="0 0 24 24">
        <!-- Google Play Colors -->
        <path fill="#4285F4" d="M3.6 1.4L13.8 11.6 3.6 21.8C3.2 21.4 3 20.8 3 20.1V3.1C3 2.4 3.2 1.8 3.6 1.4z"/>
        <path fill="#FBBC04" d="M17.3 8.1l-3.5 3.5 3.5 3.5 3.9-2.2c1.1-.6 1.1-1.7 0-2.3l-3.9-2.5z"/>
        <path fill="#EA4335" d="M13.8 11.6L3.6 1.4c.4-.4 1-.5 1.7-.1l12 6.8-3.5 3.5z"/>
        <path fill="#34A853" d="M13.8 11.6l3.5 3.5-12 6.8c-.7.4-1.3.3-1.7-.1l10.2-10.2z"/>
      </svg>
      Open in Google Play Store Now
    </a>

    <!-- App Highlights for Ad Quality & Policy Compliance -->
    <div class="features-list">
      <div class="feature-item">
        <span class="feature-icon">✓</span>
        <span>Instant Cab Booking in Khunti, Ranchi & Jharkhand</span>
      </div>
      <div class="feature-item">
        <span class="feature-icon">✓</span>
        <span>Flat 35% Discount on Round-Trip Rides</span>
      </div>
      <div class="feature-item">
        <span class="feature-icon">✓</span>
        <span>Zero Hidden Fees, Verified Drivers & Live GPS</span>
      </div>
    </div>

    <div class="footer-links">
      <a href="https://www.districtcar.in">Home</a> •
      <a href="https://www.districtcar.in/privacy-policy">Privacy Policy</a> •
      <a href="https://www.districtcar.in/delete-account">Support</a>
    </div>
  </div>

  <script>
    (function() {
      var targetUrl = "https://play.google.com/store/apps/details?id=com.districtcarcustomerd.app";
      var totalDuration = 3000; // 3 seconds
      var intervalMs = 50;
      var elapsed = 0;
      var countdownEl = document.getElementById("countdown");
      var secLabelEl = document.getElementById("secLabel");
      var progressBar = document.getElementById("progressBar");
      var statusHeader = document.getElementById("statusHeader");
      var redirected = false;

      function doRedirect() {
        if (!redirected) {
          redirected = true;
          statusHeader.textContent = "Opening Google Play Store...";
          try {
            window.location.replace(targetUrl);
          } catch(e) {
            window.location.href = targetUrl;
          }
        }
      }

      var timer = setInterval(function() {
        elapsed += intervalMs;
        var progress = Math.min((elapsed / totalDuration) * 100, 100);
        if (progressBar) progressBar.style.width = progress + "%";

        var secondsLeft = Math.max(1, Math.ceil((totalDuration - elapsed) / 1000));
        if (countdownEl) countdownEl.textContent = secondsLeft;
        if (secLabelEl) secLabelEl.textContent = secondsLeft;

        if (elapsed >= totalDuration) {
          clearInterval(timer);
          doRedirect();
        }
      }, intervalMs);

      // Manual click bypasses timer
      var btn = document.getElementById("playStoreLink");
      if (btn) {
        btn.addEventListener("click", function() {
          redirected = true;
          clearInterval(timer);
        });
      }
    })();
  </script>
</body>
</html>
