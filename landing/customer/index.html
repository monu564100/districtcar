  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #0d2149 0%, #060e22 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo-badge {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
    }
    .logo-badge svg {
      width: 38px;
      height: 38px;
      fill: #ffffff;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      background: #ffffff;
      color: #0f172a;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.15);
      transition: all 0.2s ease;
    }
    .cta-btn:hover {
      background: #f1f5f9;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.25);
    }
    .play-icon {
      width: 20px;
      height: 20px;
    }
    .footnote {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }
    .footnote a {
      color: #38bdf8;
      text-decoration: underline;
    }

  <script>
    // Backup timer fallback
    setTimeout(function() {
      window.location.href = "https://play.google.com/store/apps/details?id=com.districtcarcustomerd.app";
    }, 1500);
  </script>
