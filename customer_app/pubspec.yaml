name: district_car_customer
description: Production-grade Customer Mobile App for District Car platform.
version: 1.0.0+6
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  district_car_shared:
    path: ../shared
  firebase_core: ^2.32.0
  firebase_auth: ^4.19.7
  cloud_firestore: ^4.17.5
  cloud_functions: ^4.7.5
  firebase_storage: ^11.7.7
  firebase_messaging: ^14.9.4
  firebase_app_check: ^0.2.2+7
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
